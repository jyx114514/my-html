<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a2236">
  <meta name="description" content="个人主页 · 雨夜">
  <title>天繁的个人web</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23ff8fb8' d='M16 3C12 9 7 15 7 20a9 9 0 0 0 18 0c0-5-5-11-9-17Z'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-loading">
  <!-- 视觉层：Three.js 背景与雨 → 玻璃水滴与雾气 → 页面内容 → 光标 -->
  <canvas id="scene" aria-hidden="true"></canvas>
  <canvas id="glass" aria-hidden="true"></canvas>
  <div class="static-backdrop" aria-hidden="true">
    <div class="static-rain static-rain--far"></div>
    <div class="static-rain static-rain--near"></div>
  </div>

  <header class="nav glass" data-nav>
    <nav class="nav__links" aria-label="页面分区">
      <span class="nav__slider" aria-hidden="true"></span>
      <a href="#home" data-magnetic>首页</a>
      <a href="#about" data-magnetic>关于</a>
      <a href="#projects" data-magnetic>作品/构建/paper</a>
      <a href="#experience" data-magnetic>学习经历</a>
      <a href="#contact" data-magnetic>联系我</a>
    </nav>
  </header>

  <main>
    <section id="home" class="hero" data-section>
      <div class="hero__content" data-hero></div>
    </section>

    <section id="about" class="section" data-section>
      <header class="section__head" data-reveal>
        <p class="eyebrow">About</p>
        <h2 class="section__title">关于我</h2>
      </header>
      <div class="about" data-about></div>
    </section>

    <section id="projects" class="section" data-section>
      <header class="section__head" data-reveal>
        <p class="eyebrow">Projects</p>
        <h2 class="section__title">作品/构建/paper</h2>
      </header>
      <div class="projects" data-projects></div>
    </section>

    <section id="experience" class="section" data-section>
      <header class="section__head" data-reveal>
        <p class="eyebrow">Experience</p>
        <h2 class="section__title">学习经历</h2>
      </header>
      <ol class="timeline" data-timeline></ol>
    </section>

    <section id="contact" class="section section--contact" data-section>
      <div class="contact glass tilt" data-reveal data-contact></div>
    </section>
  </main>

  <footer class="footer" data-footer></footer>

  <!-- 特效开关 -->
  <button class="fx-toggle glass" type="button" data-fx-toggle data-magnetic aria-pressed="true">
    <span class="fx-toggle__text">
      <span class="fx-toggle__title">雨效</span>
      <span class="fx-toggle__state" data-fx-state>全效</span>
    </span>
    <span class="switch" aria-hidden="true"><span class="switch__thumb"></span></span>
  </button>

  <!-- 作品详情弹层 -->
  <div class="modal" data-modal hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <article class="modal__card glass" role="dialog" aria-modal="true" aria-labelledby="modal-title" data-modal-card></article>
  </div>

  <div class="toast glass" role="status" aria-live="polite" data-toast></div>

  <!-- 自定义光标（仅鼠标设备） -->
  <div class="cursor" aria-hidden="true">
    <div class="cursor__ring"></div>
    <div class="cursor__dot"></div>
  </div>

  <!-- raindrop-fx 是普通脚本，挂到 window.RaindropFX -->
  <script src="vendor/raindrop-fx.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
